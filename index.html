<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Border Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<div class="container">

    <h1>Image Border Tool</h1>

    <div class="controls">

        <label>White Margin (px)</label>
        <input type="number" id="margin" value="40">

        <label>Border Width (px)</label>
        <input type="number" id="borderWidth" value="1">

        <br><br>

        <input type="file" id="upload" accept="image/*">

        <button id="download">
            Download Image
        </button>

    </div>

    <canvas id="canvas"></canvas>

</div>

<script src="script.js"></script>

</html>
